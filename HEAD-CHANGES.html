<!--
  =====================================================================
  AUTO BERLIN — CAMBIOS DE SEO PARA EL <head>
  =====================================================================
  Reemplazá el bloque <head> actual en index.html con este.
  Los cambios están marcados con comentarios [SEO NEW] y [SEO CHANGED].
  =====================================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <!-- [SEO CHANGED] Título: keyword primero, separador | consistente -->
  <title>Auto Berlin | Autos de Alta Gama en Canning, Buenos Aires</title>

  <meta name="description"
    content="Auto Berlin, la concesionaria de autos de alta gama más exclusiva de Canning y zona sur. Ferrari, Porsche, BMW, Mercedes, Lamborghini y más.">

  <!-- [SEO NEW] Canonical: evita contenido duplicado entre / e /index.html -->
  <link rel="canonical" href="https://autoberlin2.vercel.app/">

  <!-- [SEO NEW] Favicon (exportá img/logo.jpg como favicon.ico y apple-touch-icon.png 180x180) -->
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

  <!-- [SEO NEW] Open Graph — para WhatsApp, Facebook, LinkedIn -->
  <meta property="og:title" content="Auto Berlin | Autos de Alta Gama en Canning, Buenos Aires">
  <meta property="og:description" content="Auto Berlin, la concesionaria de alta gama más exclusiva de Canning y zona sur. Ferrari, Porsche, BMW, Mercedes y más.">
  <meta property="og:url" content="https://autoberlin2.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_AR">
  <meta property="og:site_name" content="Auto Berlin">
  <!-- og:image: subí una imagen de 1200x630px a tu hosting y reemplazá la URL -->
  <!-- <meta property="og:image" content="https://autoberlin2.vercel.app/img/og-cover.jpg"> -->

  <!-- [SEO NEW] Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Auto Berlin | Autos de Alta Gama en Canning">
  <meta name="twitter:description" content="Concesionaria de alta gama en zona sur. Ferrari, Porsche, BMW, Mercedes y más.">

  <!-- [SEO NEW] Señales geo y de tema -->
  <meta name="theme-color" content="#DAA520">
  <meta name="geo.region" content="AR-B">
  <meta name="geo.placename" content="Canning, Buenos Aires">
  <meta name="geo.position" content="-34.8833;-58.5167">
  <meta name="ICBM" content="-34.8833, -58.5167">

  <!-- Hreflang para español de Argentina -->
  <link rel="alternate" hreflang="es-AR" href="https://autoberlin2.vercel.app/">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animated-gradient.css">
  <link rel="stylesheet" href="css/services-premium.css">

  <!-- [SEO CHANGED] Fuentes no bloqueantes (mejora LCP / Core Web Vitals) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Cormorant+SC:wght@300;400;600;700&display=swap">

  <!-- ... el resto de tu <style> inline va acá, sin cambios ... -->
